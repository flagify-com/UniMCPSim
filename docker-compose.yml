services:
  unimcpsim:
    image: ${UNIMCPSIM_IMAGE:-ghcr.io/flagify-com/unimcpsim:latest}
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
        VERSION: ${UNIMCPSIM_VERSION:-local}
        USE_CHINA_MIRRORS: ${USE_CHINA_MIRRORS:-false}
    container_name: unimcpsim
    restart: unless-stopped
    ports:
      - "9090:9090"  # MCP Server
      - "9091:9091"  # Admin Server
    volumes:
      - ./data:/app/data          # 数据持久化
      - ./logs:/app/logs          # 日志持久化
    env_file:
      - path: ./.env              # 可选环境配置
        required: false
    environment:
      - TZ=Asia/Shanghai
      - MCP_SERVER_PORT=9090
      - ADMIN_SERVER_PORT=9091
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - unimcpsim-network

networks:
  unimcpsim-network:
    driver: bridge
